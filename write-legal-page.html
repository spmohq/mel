<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Write Legal Page - Generator</title>
  
  <!-- Facebook Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'YOUR_PIXEL_ID_HERE'); 
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID_HERE&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Facebook Pixel Code -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--accent-primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px 20px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 1.05rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-word;
    }

    .btn {
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
      text-transform: uppercase;
    }

    .copy-btn {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(34, 211, 238, 0.3);
    }

    .copy-btn.copied {
      background: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Write Legal Page</h1>
      <p class="subtitle">Legal Documentation Assistant</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Data Entry</span>
        </div>
        <div class="field-block">
          <label>[Doc Name]</label>
          <input type="text" id="in_docname" class="dynamic-input" placeholder="Enter Document Name..." oninput="updatePrompt()">
        </div>
      </div>

      <!-- Result Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Final Prompt</span>
        </div>
        <div class="prompt-content" id="p_result"></div>
        <button class="btn copy-btn" id="copyBtn" onclick="copyText()">
          <span>Copy Prompt</span>
        </button>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const template = `Please write this page:

Copyright, Disclaimer & Change Notice

[Doc Name] 

লেখক: শিব প্রসাদ মুখার্জি

© শিব প্রসাদ মুখার্জি। সর্বস্বত্ব সংরক্ষিত।`;

    function updatePrompt() {
      const docName = document.getElementById('in_docname').value.trim() || "[Doc Name]";
      const result = template.replace("[Doc Name]", docName);
      document.getElementById('p_result').innerText = result;
    }

    function copyText() {
      const text = document.getElementById('p_result').innerText;
      const btn = document.getElementById('copyBtn');
      const btnSpan = btn.querySelector('span');

      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnSpan.innerText;
        btn.classList.add('copied');
        btnSpan.innerText = "Copied to Clipboard!";
        
        // Track the event in Pixel
        if(typeof fbq === 'function') {
          fbq('track', 'Contact', { content_name: 'Legal Page Prompt Copied' });
        }

        setTimeout(() => {
          btn.classList.remove('copied');
          btnSpan.innerText = originalText;
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompt;
  </script>
</body>
</html>
