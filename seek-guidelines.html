<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seek Guidelines - Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--accent-primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 650px) {
      .input-grid { grid-template-columns: 1fr; }
    }

    .field-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dynamic-textarea {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      min-height: 80px;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s;
    }

    .dynamic-textarea:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-word;
    }

    /* Custom Scrollbar */
    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
      text-transform: uppercase;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Seek Guidelines</h1>
      <p class="subtitle">AI-Powered Learning Support</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Inputs Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Data Input</span>
          <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
        
        <div class="input-grid">
          <div class="field-block">
            <label>[Board]</label>
            <textarea id="in_board" class="dynamic-textarea" placeholder="e.g. CBSE / WBBSE" oninput="updatePrompts()"></textarea>
          </div>
          
          <div class="field-block">
            <label>[Class]</label>
            <textarea id="in_class" class="dynamic-textarea" placeholder="e.g. Class 10" oninput="updatePrompts()"></textarea>
          </div>
          
          <div class="field-block">
            <label>[বিষয় / Subject]</label>
            <textarea id="in_subject" class="dynamic-textarea" placeholder="e.g. Physics" oninput="updatePrompts()"></textarea>
          </div>
          
          <div class="field-block">
            <label>[Chapter]</label>
            <textarea id="in_chapter" class="dynamic-textarea" placeholder="e.g. Light" oninput="updatePrompts()"></textarea>
          </div>

          <div class="field-block full-width">
            <label>[Topic/Part]</label>
            <textarea id="in_topic" class="dynamic-textarea" placeholder="e.g. Refraction of Light" oninput="updatePrompts()"></textarea>
          </div>

          <div class="field-block full-width">
            <label>[আমি কী বুঝতে পারছি না / কোথায় আটকে গেছি]</label>
            <textarea id="in_problem" class="dynamic-textarea" placeholder="Describe where you are stuck..." oninput="updatePrompts()"></textarea>
          </div>
        </div>
      </div>

      <!-- Prompt #1 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Prompt #1</span>
        </div>
        <div class="prompt-content" id="p1"></div>
        <button class="btn copy-btn" onclick="copyText('p1', this)">
          <span>Copy Prompt #1</span>
        </button>
      </div>

      <!-- Prompt #2 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Prompt #2</span>
        </div>
        <div class="prompt-content" id="p2"></div>
        <button class="btn copy-btn" onclick="copyText('p2', this)">
          <span>Copy Prompt #2</span>
        </button>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const p1Template = `আমি [Board]-এর [Class]-এর [বিষয়] পড়ছি।

আমার [Chapter]-এর [Topic/Part] নিয়ে সমস্যা হয়েছে।

আমার সমস্যা:

[আমি কী বুঝতে পারছি না / কোথায় আটকে গেছি]

আপনি আমার বন্ধু, mentor, coach ও guide-এর মতো আমাকে সাহায্য করুন।

আমার সমস্যাটা কীভাবে সমাধান করব, সেটা সহজভাবে ধাপে ধাপে বুঝিয়ে দিন।

এর জন্য আমি NotebookLM-এর কোন কোন Tool-এর সাহায্য নিতে পারি, কীভাবে সেগুলো ব্যবহার করব এবং প্রতিটি Tool আমার সমস্যাটা সমাধান করতে কী উদ্দেশ্যে কাজে লাগবে—সেটাও আমাকে সহজ করে বুঝিয়ে দিন।`;

    const p2Template = `আমি [Board]-এর [Class]-এ পড়ছি।

 আমি [বিষয়]-এর [Chapter]-এর [Topic/Part] নিয়ে আটকে গেছি।

আমার সমস্যা: [আমি কী বুঝতে পারছি না / কোথায় আটকে গেছি]

সহজভাবে আমাকে বুঝিয়ে বলুন কীভাবে সমস্যাটা সমাধান করব। তারপর বলুন—NotebookLM-এর কোন Tool ব্যবহার করব, কীভাবে ব্যবহার করব, কী Prompt লিখব এবং Output দিয়ে কীভাবে পড়ব।`;

    function updatePrompts() {
      const board = document.getElementById('in_board').value.trim() || "[Board]";
      const classLvl = document.getElementById('in_class').value.trim() || "[Class]";
      const subject = document.getElementById('in_subject').value.trim() || "[বিষয়]";
      const chapter = document.getElementById('in_chapter').value.trim() || "[Chapter]";
      const topic = document.getElementById('in_topic').value.trim() || "[Topic/Part]";
      const problem = document.getElementById('in_problem').value.trim() || "[আমি কী বুঝতে পারছি না / কোথায় আটকে গেছি]";

      // Logic for Prompt 1
      let res1 = p1Template;
      res1 = res1.replace("[Board]", board);
      res1 = res1.replace("[Class]", classLvl);
      res1 = res1.replace("[বিষয়]", subject);
      res1 = res1.replace("[Chapter]", chapter);
      res1 = res1.replace("[Topic/Part]", topic);
      res1 = res1.replace("[আমি কী বুঝতে পারছি না / কোথায় আটকে গেছি]", problem);
      document.getElementById('p1').innerText = res1;

      // Logic for Prompt 2 (note the slightly different spelling of subject placeholder in template)
      let res2 = p2Template;
      res2 = res2.replace("[Board]", board);
      res2 = res2.replace("[Class]", classLvl);
      res2 = res2.replace("[বিষয়]", subject); 
      res2 = res2.replace("[Chapter]", chapter);
      res2 = res2.replace("[Topic/Part]", topic);
      res2 = res2.replace("[আমি কী বুঝতে পারছি না / কোথায় আটকে গেছি]", problem);
      document.getElementById('p2').innerText = res2;
    }

    function clearAll() {
      document.getElementById('in_board').value = "";
      document.getElementById('in_class').value = "";
      document.getElementById('in_subject').value = "";
      document.getElementById('in_chapter').value = "";
      document.getElementById('in_topic').value = "";
      document.getElementById('in_problem').value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompts;
  </script>
</body>
</html>
