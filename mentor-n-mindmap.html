<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mentor-N-Mind Map - Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--accent-primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .field-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dynamic-textarea {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      min-height: 80px;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s;
    }

    .dynamic-textarea:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 500px;
      overflow-y: auto;
    }

    /* Scrollbar Styling */
    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mentor-N-Mind Map</h1>
      <p class="subtitle">Personalized Learning & Guide Engine</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Inputs Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Data Entry</span>
          <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
        
        <div class="input-grid">
          <div class="field-block">
            <label>[Class]</label>
            <textarea id="in_class" class="dynamic-textarea" placeholder="Enter Class..." oninput="updatePrompts()"></textarea>
          </div>
          
          <div class="field-block">
            <label>[বিষয়]</label>
            <textarea id="in_subject" class="dynamic-textarea" placeholder="Enter Subject..." oninput="updatePrompts()"></textarea>
          </div>
          
          <div class="field-block">
            <label>[Chapter]</label>
            <textarea id="in_chapter" class="dynamic-textarea" placeholder="Enter Chapter Name..." oninput="updatePrompts()"></textarea>
          </div>
          
          <div class="field-block">
            <label>[Topic/Part]</label>
            <textarea id="in_topic" class="dynamic-textarea" placeholder="Enter Topic/Part..." oninput="updatePrompts()"></textarea>
          </div>

          <div class="field-block">
            <label>[কী বুঝতে পারছি না / কোথায় আটকে গেছি]</label>
            <textarea id="in_problem" class="dynamic-textarea" placeholder="Describe the problem..." oninput="updatePrompts()"></textarea>
          </div>
        </div>
      </div>

      <!-- Result Card 1 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Prompt #1: Mind Map</span>
        </div>
        <div class="prompt-content" id="p1"></div>
        <button class="btn copy-btn" onclick="copyText('p1', this)">
          <span>Copy Prompt #1</span>
        </button>
      </div>

      <!-- Result Card 2 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Prompt #2: Mentor Guide</span>
        </div>
        <div class="prompt-content" id="p2"></div>
        <button class="btn copy-btn" onclick="copyText('p2', this)">
          <span>Copy Prompt #2</span>
        </button>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const p1Template = `আমি West Bengal Board of Secondary Education-র Class [Class] -এর একজন ছাত্র / ছাত্রী। আমি ইংরেজিতে দুর্বল এবং computer ও internet ব্যবহারে খুব স্বচ্ছন্দ নই।

আমি এখন [বিষয়]-এর [Chapter]-এর [Topic/Part] নিয়ে পড়ছি।

আমি আমার বেস টেক্সট বুক লেসন-র চ্যাপ্টারটার পিডিএফ আপলোড করেছি। 

এই চ্যাপ্টারটার একটা মাইন্ড ম্যাপ বানাও যেটা এই চ্যাপ্টারটা বোঝার ও মনে রাখার টুল হিসেবে আমার কাজে লাগবে।

এটা জরুরি নয় যে আপলোড করা ডকুমেন্টটার কনটেন্ট স্ট্রাকচার ফলো করেই এই মাইন্ড ম্যাপটা বানাতে হবে - এর seed, branches, leaves, flowers, and fruits এমনভাবে বানাও যেমন ভাবে একটা বীজ থেকে অংকুর বের হয়ে ক্রমে ধাপপ ধাপে তা ম্যাচুওর হতে হতে তার কান্ড, শাখাপ্রশাখা মেলে ধরে ও ফুল-ফল দেয়।

এই মাইন্ড ম্যাপে ছবি ও টেক্সট উভয়ই ব্যবহার করো, যাতে প্রথম পাঠের আগে টেরিটরিটা বুঝতে ও পরীক্ষার আগের রাতে পুরো চ্যাপ্টারটা recall করতে সাহায্য করে।`;

    const p2Template = `আমি West Bengal Board of Secondary Education-র Class [Class] -এর একজন ছাত্র / ছাত্রী। আমি ইংরেজিতে দুর্বল এবং computer ও internet ব্যবহারে খুব স্বচ্ছন্দ নই।

আমি এখন [বিষয়]-এর [Chapter]-এর [Topic/Part] নিয়ে পড়ছি।

এখানে আমি একটা সমস্যায় পড়েছি।

আমার সমস্যা:
[কী বুঝতে পারছি না / কোথায় আটকে গেছি]

আপনি আমার বন্ধু, mentor, coach ও guide-এর মতো আমাকে সাহায্য করুন।

সহজভাবে বলুন, সমস্যাটা কীভাবে সমাধান করব। তারপর বলুন:

এক, কোন টুল ব্যবহার করতে হবে 
দুই,  সেই টুলের কোন ফীচারটা ব্যবহার করতে হবে 
তিন, টুলটা ও টুলের ফীচারটা অ্যাকসেস করার ধাপে ধাপে পদ্ধতিটা কি
চার, ফীচারটা ব্যবহার করার ধাপে ধাপে পদ্ধতিটা কি
পাঁচ, কোন বা কোন কোন প্রম্পট ব্যবহার করতে হবে 
ছয়, কোন ধাপে কোন প্রম্পট ব্যবহার করতে হবে

বিস্তারিত ভাবে বুঝিয়ে বলার পরে আমাকে নীচে দেওয়া ছয়টা কলামের একটা টেবিল বানিয়ে দাও -

ছয়টা কলামের টাইটেল:
এক, কোন টুল ব্যবহার করতে হবে 
দুই,  সেই টুলের কোন ফীচারটা ব্যবহার করতে হবে 
তিন, টুলটা ও টুলের ফীচারটা অ্যাকসেস করার ধাপে ধাপে পদ্ধতিটা কি
চার, ফীচারটা ব্যবহার করার ধাপে ধাপে পদ্ধতিটা কি
পাঁচ, কোন বা কোন কোন প্রম্পট ব্যবহার করতে হবে 
ছয়, কোন ধাপে কোন প্রম্পট ব্যবহার করতে হবে`;

    function updatePrompts() {
      const cls = document.getElementById('in_class').value.trim() || "[Class]";
      const subject = document.getElementById('in_subject').value.trim() || "[বিষয়]";
      const chapter = document.getElementById('in_chapter').value.trim() || "[Chapter]";
      const topic = document.getElementById('in_topic').value.trim() || "[Topic/Part]";
      const problem = document.getElementById('in_problem').value.trim() || "[কী বুঝতে পারছি না / কোথায় আটকে গেছি]";

      // Logic for Prompt 1
      let res1 = p1Template;
      res1 = res1.split("[Class]").join(cls);
      res1 = res1.split("[বিষয়]").join(subject);
      res1 = res1.split("[Chapter]").join(chapter);
      res1 = res1.split("[Topic/Part]").join(topic);
      document.getElementById('p1').innerText = res1;

      // Logic for Prompt 2
      let res2 = p2Template;
      res2 = res2.split("[Class]").join(cls);
      res2 = res2.split("[বিষয়]").join(subject);
      res2 = res2.split("[Chapter]").join(chapter);
      res2 = res2.split("[Topic/Part]").join(topic);
      res2 = res2.split("[কী বুঝতে পারছি না / কোথায় আটকে গেছি]").join(problem);
      document.getElementById('p2').innerText = res2;
    }

    function clearAll() {
      document.getElementById('in_class').value = "";
      document.getElementById('in_subject').value = "";
      document.getElementById('in_chapter').value = "";
      document.getElementById('in_topic').value = "";
      document.getElementById('in_problem').value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompts;
  </script>
</body>
</html>
